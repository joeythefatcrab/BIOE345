<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fractal Explorer</title>
<style>
  :root {
    --bg: #0b0b12;
    --panel: #15151f;
    --border: #2a2a3a;
    --text: #e8e8f0;
    --muted: #9a9ab0;
    --accent: #7c5cff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .app {
    display: flex; flex-direction: column; height: 100%;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header p { margin: 0; font-size: 13px; color: var(--muted); }
  .main {
    display: flex; flex: 1; min-height: 0;
  }
  .controls {
    width: 300px; flex-shrink: 0; padding: 16px; overflow-y: auto;
    border-right: 1px solid var(--border); background: var(--panel);
  }
  .control-group { margin-bottom: 18px; }
  .control-group label {
    display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  select, input[type="number"] {
    width: 100%; padding: 8px 10px; background: #1d1d2a; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; font-size: 14px;
  }
  input[type="range"] { width: 100%; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .val { font-size: 12px; color: var(--muted); margin-top: 4px; }
  button {
    width: 100%; padding: 10px; margin-top: 6px; border: none; border-radius: 6px;
    background: var(--accent); color: white; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  button.secondary {
    background: transparent; border: 1px solid var(--border); color: var(--text);
  }
  .canvas-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: #05050a; position: relative; overflow: hidden;
  }
  canvas { cursor: crosshair; max-width: 100%; max-height: 100%; }
  .hint {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    font-size: 12px; color: var(--muted); background: rgba(0,0,0,0.5);
    padding: 4px 10px; border-radius: 12px; pointer-events: none;
  }
  .coords {
    position: absolute; top: 10px; left: 10px; font-size: 11px; color: var(--muted);
    background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 6px; font-family: monospace;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Fractal Explorer</h1>
    <p>Mandelbrot &amp; Julia sets &mdash; click to zoom, drag to pan</p>
  </header>
  <div class="main">
    <div class="controls">
      <div class="control-group">
        <label>Fractal Type</label>
        <select id="fractalType">
          <option value="mandelbrot">Mandelbrot Set</option>
          <option value="julia">Julia Set</option>
        </select>
      </div>

      <div class="control-group" id="juliaControls" style="display:none">
        <label>Julia Constant (c)</label>
        <div class="row">
          <div>
            <input type="number" id="juliaRe" value="-0.7" step="0.01">
            <div class="val">real</div>
          </div>
          <div>
            <input type="number" id="juliaIm" value="0.27" step="0.01">
            <div class="val">imaginary</div>
          </div>
        </div>
      </div>

      <div class="control-group">
        <label>Max Iterations: <span id="iterVal">200</span></label>
        <input type="range" id="maxIter" min="20" max="800" value="200" step="10">
      </div>

      <div class="control-group">
        <label>Color Palette</label>
        <select id="palette">
          <option value="twilight">Twilight</option>
          <option value="fire">Fire</option>
          <option value="ocean">Ocean</option>
          <option value="rainbow">Rainbow</option>
          <option value="mono">Monochrome</option>
        </select>
      </div>

      <div class="control-group">
        <label>Zoom: <span id="zoomVal">1.0x</span></label>
        <input type="range" id="zoomSlider" min="0" max="1" value="0" step="0.001">
      </div>

      <div class="control-group">
        <label>Center (Real / Imaginary)</label>
        <div class="row">
          <div>
            <input type="number" id="centerRe" value="-0.5" step="0.01">
          </div>
          <div>
            <input type="number" id="centerIm" value="0" step="0.01">
          </div>
        </div>
      </div>

      <button id="renderBtn">Render Fractal</button>
      <button class="secondary" id="resetBtn">Reset View</button>
      <button class="secondary" id="downloadBtn">Download PNG</button>
    </div>

    <div class="canvas-wrap">
      <canvas id="fractalCanvas" width="800" height="800"></canvas>
      <div class="coords" id="coords">real: 0, imag: 0</div>
      <div class="hint">Click to zoom in &middot; Shift+click to zoom out &middot; Drag to pan</div>
    </div>
  </div>
</div>

<script src="fractal.js"></script>
</body>
</html>
