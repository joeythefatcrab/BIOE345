<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fractal Explorer — GPU Edition</title>
<style>
  :root {
    --bg: #05050a;
    --panel: rgba(18, 18, 28, 0.72);
    --border: #2c2c42;
    --text: #eaeaf5;
    --muted: #9a9ab5;
    --accent: #a855f7;
    --accent2: #22d3ee;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .app { position: relative; width: 100%; height: 100%; }
  canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%; /* CSS display size must be explicit — a canvas's
      display size otherwise defaults to its width/height ATTRIBUTES (the internal
      pixel-buffer resolution), which on a high-DPI screen is larger than the
      viewport, silently cropping the render to its top-left quarter. */
    display: block; cursor: grab;
  }
  canvas.dragging { cursor: grabbing; }

  header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    padding: 16px 22px; display: flex; align-items: baseline; gap: 12px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
    pointer-events: none;
  }
  header h1 {
    margin: 0; font-size: 19px; font-weight: 700;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { margin: 0; font-size: 12.5px; color: var(--muted); }

  .panel {
    position: absolute; top: 70px; left: 18px; z-index: 5; width: 268px;
    background: var(--panel); backdrop-filter: blur(14px);
    border: 1px solid var(--border); border-radius: 14px; padding: 16px;
    max-height: calc(100% - 100px); overflow-y: auto;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .group { margin-bottom: 16px; }
  .group label {
    display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;
  }
  select, input[type="number"] {
    width: 100%; padding: 7px 9px; background: #1a1a28; color: var(--text);
    border: 1px solid var(--border); border-radius: 7px; font-size: 13px;
  }
  input[type="range"] {
    width: 100%; accent-color: var(--accent);
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button {
    width: 100%; padding: 9px; margin-top: 5px; border: none; border-radius: 8px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    color: #0a0a12; font-size: 13px; font-weight: 700; cursor: pointer;
    transition: filter 0.15s;
  }
  button:hover { filter: brightness(1.15); }
  button.secondary {
    background: transparent; border: 1px solid var(--border); color: var(--text);
  }
  button.active {
    box-shadow: 0 0 0 2px var(--accent2) inset;
  }
  .toggle-row { display: flex; gap: 8px; }
  .toggle-row button { margin-top: 5px; }

  .hud {
    position: absolute; bottom: 14px; left: 18px; z-index: 5;
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px;
    color: var(--muted); background: rgba(0,0,0,0.5); padding: 6px 10px;
    border-radius: 8px; pointer-events: none; line-height: 1.5;
  }
  .credit {
    position: absolute; bottom: 14px; right: 18px; z-index: 5;
    font-size: 11px; color: var(--muted); background: rgba(0,0,0,0.5);
    padding: 6px 10px; border-radius: 8px; pointer-events: none;
  }
</style>
</head>
<body>
<div class="app">
  <canvas id="glcanvas"></canvas>

  <header>
    <h1>&#9670; Fractal Explorer</h1>
    <p>GPU-rendered &middot; scroll to zoom &middot; drag to pan</p>
  </header>

  <div class="panel">
    <div class="group">
      <label>Fractal Type</label>
      <select id="fractalType">
        <option value="0">Mandelbrot Set</option>
        <option value="1">Julia Set</option>
        <option value="2">Burning Ship</option>
        <option value="3">Tricorn</option>
      </select>
    </div>

    <div class="group" id="juliaGroup" style="display:none">
      <label>Julia Constant</label>
      <div class="row">
        <input type="number" id="juliaRe" value="-0.7" step="0.01">
        <input type="number" id="juliaIm" value="0.27" step="0.01">
      </div>
    </div>

    <div class="group">
      <label>Iterations: <span id="iterVal">300</span></label>
      <input type="range" id="maxIter" min="50" max="1500" value="300" step="10">
    </div>

    <div class="group">
      <label>Palette</label>
      <select id="palette">
        <option value="0">Twilight</option>
        <option value="1">Fire</option>
        <option value="2">Ocean</option>
        <option value="3">Rainbow</option>
        <option value="4">Neon</option>
        <option value="5">Monochrome</option>
      </select>
    </div>

    <div class="group">
      <label>Color Cycle Speed: <span id="cycleVal">0</span></label>
      <input type="range" id="cycleSpeed" min="0" max="100" value="0" step="1">
    </div>

    <div class="group toggle-row">
      <button id="autopilotBtn">&#9654; Autopilot</button>
    </div>

    <div class="group">
      <button class="secondary" id="resetBtn">Reset View</button>
      <button class="secondary" id="downloadBtn">Download PNG</button>
    </div>
  </div>

  <div class="hud" id="hud">zoom: 1.00x &middot; center: (-0.5, 0)</div>
  <div class="credit">z&#8319;&#8314;&#185; = z&#8319;&#178; + c</div>
</div>

<script src="fractal.js"></script>
</body>
</html>
